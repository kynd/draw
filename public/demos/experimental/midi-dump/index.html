<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIDI dump</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../../styles/demo-ui.css" />
  <style>
    .log-wrap {
      flex: 1 1 auto;
      min-width: 0;
      background: var(--demo-bg);
      overflow-y: auto;
      padding: 10px 14px;
    }
    .log-wrap .line {
      font-family: var(--font-code, 'Google Sans Code', monospace);
      font-size: 0.62rem;
      line-height: 1.7;
      color: #2a2a2a;
      white-space: pre-wrap;
    }
    .log-wrap .line .bytes { color: #9a9a9a; }
    .log-wrap .line.meta { color: #9a9a9a; }
  </style>
</head>
<body>
  <div class="demo-layout" id="layout">
    <div class="log-wrap" id="log"></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">MIDI input</span></div>
      <div class="dp-sub-label">Devices</div>
      <div class="dp-note" id="devices">No inputs.</div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Log</span></div>
      <div class="dp-btn-row">
        <button id="clear-btn" class="dp-btn secondary">Clear</button>
      </div>
      <div class="dp-note">Every incoming message is listed with its raw bytes and a reading. The log keeps the last 500 lines.</div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
