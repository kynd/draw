<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chase smoothing — a curvature-limited pursuit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../../styles/demo-ui.css" />
  <style>
    .canvas-wrap { cursor: crosshair; touch-action: none; }
  </style>
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Draw</span></div>
      <div class="dp-note">Draw on the canvas with the mouse. The drawn line replaces the previous one.</div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Chase</span></div>
      <div class="dp-row">
        <span class="dp-label">Radius</span>
        <input id="radius" class="dp-range" type="range" min="5" max="160" step="1" value="60" />
        <span class="dp-val" id="radius-val">60</span>
      </div>
      <div class="dp-note">A tip chases the pointer, turning no tighter than this radius, so corners and jitter sharper than it are rounded.</div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Lines</span></div>
      <div class="dp-stats">
        <span>drawn<strong style="color:#b0b0b0">gray</strong></span>
        <span>chased<strong style="color:#2a7a5a">green</strong></span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-section collapsed">
        <div class="dp-section-hd">
          <span class="dp-chevron"></span>
          <span class="dp-title">Geometry</span>
        </div>
        <div class="dp-section-body"><div id="readout"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
