<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pencil strokes — thin grainy lines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Pencil</span></div>
      <div class="dp-row">
        <span class="dp-label">Grain</span>
        <input id="grain" class="dp-range" type="range" min="0" max="1" step="0.02" value="0.55" />
        <span class="dp-val" id="grain-val">0.55</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Pressure</span>
        <input id="pressure" class="dp-range" type="range" min="0" max="0.9" step="0.02" value="0.45" />
        <span class="dp-val" id="pressure-val">0.45</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Shape</span></div>
      <div class="dp-row">
        <span class="dp-label">Width</span>
        <input id="width" class="dp-range" type="range" min="0.003" max="0.030" step="0.001" value="0.008" />
        <span class="dp-val" id="width-val">0.008</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Color</span></div>
      <div class="dp-btn-row">
        <button id="random-btn" class="dp-btn secondary">Randomize colors</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-section collapsed">
        <div class="dp-section-hd">
          <span class="dp-chevron"></span>
          <span class="dp-title">Geometry</span>
        </div>
        <div class="dp-section-body"><div id="readout"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
