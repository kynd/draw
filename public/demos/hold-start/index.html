<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Held start — the mark waits for a stable direction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
  <style>
    .canvas-wrap { cursor: crosshair; touch-action: none; }
  </style>
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Draw</span></div>
      <div class="dp-note">Draw on the canvas with the mouse. The drawn line replaces the previous one; the thin black line is the pointer itself.</div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Held start</span></div>
      <div class="dp-row">
        <span class="dp-label">Hold</span>
        <input id="hold" class="dp-range" type="range" min="0" max="30" step="1" value="12" />
        <span class="dp-val" id="hold-val">12</span>
      </div>
      <div class="dp-note">Pixels of travel before the mark appears. At 0 the mark draws from the first sample and its start flickers.</div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Stroke</span></div>
      <div class="dp-row">
        <span class="dp-label">Width</span>
        <input id="width" class="dp-range" type="range" min="0.02" max="0.16" step="0.005" value="0.090" />
        <span class="dp-val" id="width-val">0.090</span>
      </div>

      <div class="dp-btn-row">
        <button id="random-btn" class="dp-btn secondary">Randomize colors</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-section collapsed">
        <div class="dp-section-hd">
          <span class="dp-chevron"></span>
          <span class="dp-title">Numbers</span>
        </div>
        <div class="dp-section-body"><div id="readout"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
