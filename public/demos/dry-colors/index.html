<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multicolor dry media — rainbow lead and mixed pigment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Media</span></div>
      <div class="dp-note">Top to bottom: rainbow pencil, multicolor charcoal, multicolor pastel.</div>
      <div class="dp-row">
        <span class="dp-label">Grain</span>
        <input id="grain" class="dp-range" type="range" min="0" max="1.6" step="0.05" value="1.00" />
        <span class="dp-val" id="grain-val">1.00</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Pressure</span>
        <input id="pressure" class="dp-range" type="range" min="0" max="1.6" step="0.05" value="1.00" />
        <span class="dp-val" id="pressure-val">1.00</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Shape</span></div>
      <div class="dp-row">
        <span class="dp-label">Scale</span>
        <input id="scale" class="dp-range" type="range" min="0.5" max="2" step="0.05" value="1.00" />
        <span class="dp-val" id="scale-val">1.00</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Color</span></div>
      <div class="dp-btn-row">
        <button id="random-btn" class="dp-btn secondary">Randomize colors</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-section collapsed">
        <div class="dp-section-hd">
          <span class="dp-chevron"></span>
          <span class="dp-title">Geometry</span>
        </div>
        <div class="dp-section-body"><div id="readout"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
