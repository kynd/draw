<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oil strokes — dragged paint with lit relief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Paint</span></div>
      <div class="dp-row">
        <span class="dp-label">Coverage</span>
        <input id="paint" class="dp-range" type="range" min="0.3" max="1" step="0.02" value="1.00" />
        <span class="dp-val" id="paint-val">1.00</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Drag</span>
        <input id="drag" class="dp-range" type="range" min="0" max="160" step="5" value="25" />
        <span class="dp-val" id="drag-val">25</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Relief</span></div>
      <div class="dp-row">
        <span class="dp-label">Ridges</span>
        <input id="ridges" class="dp-range" type="range" min="0" max="1" step="0.02" value="0.50" />
        <span class="dp-val" id="ridges-val">0.50</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Stretch</span>
        <input id="stretch" class="dp-range" type="range" min="0.1" max="2" step="0.1" value="0.3" />
        <span class="dp-val" id="stretch-val">0.3</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Gloss</span>
        <input id="gloss" class="dp-range" type="range" min="0" max="1.2" step="0.05" value="0.40" />
        <span class="dp-val" id="gloss-val">0.40</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Shape</span></div>
      <div class="dp-row">
        <span class="dp-label">Width</span>
        <input id="width" class="dp-range" type="range" min="0.04" max="0.18" step="0.005" value="0.120" />
        <span class="dp-val" id="width-val">0.120</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Color</span></div>
      <div class="dp-btn-row">
        <button id="random-btn" class="dp-btn secondary">Randomize colors</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Overlays</span></div>
      <div class="dp-btn-row">
        <button id="wire-btn" class="dp-toggle">Wireframe</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-section collapsed">
        <div class="dp-section-hd">
          <span class="dp-chevron"></span>
          <span class="dp-title">Geometry</span>
        </div>
        <div class="dp-section-body"><div id="readout"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
