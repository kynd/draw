<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow strokes — drop shadow, deboss, glow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Effects</span></div>
      <div class="dp-note">Top to bottom: drop shadow, deboss, glow.</div>
      <div class="dp-row">
        <span class="dp-label">Offset</span>
        <input id="offset" class="dp-range" type="range" min="0" max="0.12" step="0.005" value="0.045" />
        <span class="dp-val" id="offset-val">0.045</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Softness</span>
        <input id="softness" class="dp-range" type="range" min="0.2" max="2.5" step="0.05" value="0.90" />
        <span class="dp-val" id="softness-val">0.90</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Glow</span>
        <input id="glow" class="dp-range" type="range" min="0" max="1.2" step="0.05" value="0.85" />
        <span class="dp-val" id="glow-val">0.85</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Shape</span></div>
      <div class="dp-row">
        <span class="dp-label">Width</span>
        <input id="width" class="dp-range" type="range" min="0.03" max="0.16" step="0.005" value="0.090" />
        <span class="dp-val" id="width-val">0.090</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Color</span></div>
      <div class="dp-btn-row">
        <button id="random-btn" class="dp-btn secondary">Randomize colors</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-section collapsed">
        <div class="dp-section-hd">
          <span class="dp-chevron"></span>
          <span class="dp-title">Geometry</span>
        </div>
        <div class="dp-section-body"><div id="readout"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
