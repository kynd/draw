<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drawing tool demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
  <style>
    .canvas-wrap { cursor: crosshair; touch-action: none; }
  </style>
</head>
<body>
  <div class="demo-layout" id="layout">
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>

      <div class="dp-overlay-tr">
        <button id="clear-btn" class="dp-icon-btn text" title="Clear and rescatter">Clear</button>
        <button id="replay-btn" class="dp-icon-btn text" title="Replay">Replay</button>
        <button id="auto-btn" class="dp-icon-btn text" title="Randomize on release and every so many pixels">Auto</button>
        <button id="fullscreen-btn" class="dp-icon-btn" title="Full screen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>

      <div class="dp-overlay-panel" id="auto-panel" style="display:none">
        <span class="dp-label">Every</span>
        <input id="auto-px" class="dp-range" type="range" min="40" max="600" step="10" value="200" />
        <span class="dp-val" id="auto-px-val">200</span>
      </div>

      <div class="dp-dials">
        <div id="dial-hue"></div>
        <div id="dial-tool"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
