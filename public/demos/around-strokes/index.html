<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Around strokes — paths derived from a path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Effects</span></div>
      <div class="dp-note">Top to bottom: spiral, entangled, scattered.</div>
      <div class="dp-row">
        <span class="dp-label">Turns</span>
        <input id="turns" class="dp-range" type="range" min="4" max="48" step="1" value="22" />
        <span class="dp-val" id="turns-val">22</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Paths</span>
        <input id="paths" class="dp-range" type="range" min="2" max="14" step="1" value="6" />
        <span class="dp-val" id="paths-val">6</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Scatter</span>
        <input id="scatter" class="dp-range" type="range" min="10" max="200" step="5" value="60" />
        <span class="dp-val" id="scatter-val">60</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Shape</span></div>
      <div class="dp-row">
        <span class="dp-label">Width</span>
        <input id="width" class="dp-range" type="range" min="0.004" max="0.03" step="0.001" value="0.012" />
        <span class="dp-val" id="width-val">0.012</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Color</span></div>
      <div class="dp-btn-row">
        <button id="random-btn" class="dp-btn secondary">Randomize colors</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-section collapsed">
        <div class="dp-section-hd">
          <span class="dp-chevron"></span>
          <span class="dp-title">Geometry</span>
        </div>
        <div class="dp-section-body"><div id="readout"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
