<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shaped strokes — cloud, rounded squares, spikes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Shapes</span></div>
      <div class="dp-note">Top to bottom: cloud, rounded squares, spikes.</div>
      <div class="dp-row">
        <span class="dp-label">Blob</span>
        <input id="blob" class="dp-range" type="range" min="0.6" max="3" step="0.1" value="1.5" />
        <span class="dp-val" id="blob-val">1.5</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Offset</span>
        <input id="offset" class="dp-range" type="range" min="0" max="3" step="0.1" value="1.3" />
        <span class="dp-val" id="offset-val">1.3</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Cell</span>
        <input id="cell" class="dp-range" type="range" min="0.08" max="0.3" step="0.01" value="0.14" />
        <span class="dp-val" id="cell-val">0.14</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Spikes</span>
        <input id="spikes" class="dp-range" type="range" min="1" max="10" step="0.5" value="4" />
        <span class="dp-val" id="spikes-val">4.0</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Sharp</span>
        <input id="sharp" class="dp-range" type="range" min="1" max="12" step="0.5" value="5" />
        <span class="dp-val" id="sharp-val">5.0</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Shape</span></div>
      <div class="dp-row">
        <span class="dp-label">Width</span>
        <input id="width" class="dp-range" type="range" min="0.03" max="0.14" step="0.005" value="0.070" />
        <span class="dp-val" id="width-val">0.070</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Color</span></div>
      <div class="dp-btn-row">
        <button id="random-btn" class="dp-btn secondary">Randomize colors</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Overlays</span></div>
      <div class="dp-btn-row">
        <button id="wire-btn" class="dp-toggle">Wireframe</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-section collapsed">
        <div class="dp-section-hd">
          <span class="dp-chevron"></span>
          <span class="dp-title">Geometry</span>
        </div>
        <div class="dp-section-body"><div id="readout"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
