<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wet strokes — strokes that read the background</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Water</span></div>
      <div class="dp-row">
        <span class="dp-label">Pigment</span>
        <input id="pigment" class="dp-range" type="range" min="0" max="1" step="0.02" value="0.55" />
        <span class="dp-val" id="pigment-val">0.55</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Rim</span>
        <input id="rim" class="dp-range" type="range" min="0" max="1" step="0.02" value="0.45" />
        <span class="dp-val" id="rim-val">0.45</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Drag</span></div>
      <div class="dp-row">
        <span class="dp-label">Reach</span>
        <input id="drag" class="dp-range" type="range" min="0" max="220" step="5" value="90" />
        <span class="dp-val" id="drag-val">90</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Vary</span>
        <input id="variation" class="dp-range" type="range" min="0" max="1" step="0.02" value="0.75" />
        <span class="dp-val" id="variation-val">0.75</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Shape</span></div>
      <div class="dp-row">
        <span class="dp-label">Width</span>
        <input id="width" class="dp-range" type="range" min="0.03" max="0.150" step="0.005" value="0.120" />
        <span class="dp-val" id="width-val">0.120</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Edge</span>
        <input id="edge" class="dp-range" type="range" min="0" max="0.7" step="0.02" value="0.28" />
        <span class="dp-val" id="edge-val">0.28</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Strokes</span></div>
      <div class="dp-note">Top to bottom: watercolor, smear, wet brush.</div>
      <div class="dp-btn-row">
        <button id="random-btn" class="dp-btn secondary">Randomize colors</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-section collapsed">
        <div class="dp-section-hd">
          <span class="dp-chevron"></span>
          <span class="dp-title">Geometry</span>
        </div>
        <div class="dp-section-body"><div id="readout"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
