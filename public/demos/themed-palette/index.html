<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Themed palette — hue, count, theme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
  <style>
    /* Stage: one column per color. */
    .pm-stage { position: absolute; inset: 0; padding: 20px; }
    .pm-grid { display: grid; gap: 3px; width: 100%; height: 100%; }
    .pm-cell {
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: flex-end;
      padding: 4px 5px; gap: 1px;
      font-family: 'Google Sans Code', monospace; font-size: 0.52rem;
      line-height: 1.35;
      cursor: pointer; overflow: hidden;
      transition: outline-color 0.12s;
      outline: 2px solid transparent; outline-offset: -2px;
    }
    .pm-lch { font-size: 0.48rem; opacity: 0.72; white-space: nowrap; }
    .pm-cell:hover { outline-color: rgba(0,0,0,0.35); }
  </style>
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap">
      <div class="pm-stage"><div class="pm-grid" id="grid"></div></div>
      <div class="dp-toast" id="toast"></div>
    </div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Key hue</span></div>
      <canvas id="ring" class="dp-ring" width="220" height="220"></canvas>
      <div class="dp-note">Drag the handle to move the key hue.</div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Colors</span></div>
      <div class="dp-row">
        <span class="dp-label">Count</span>
        <input id="count" class="dp-range" type="range" min="1" max="10" step="1" value="5" />
        <span class="dp-val" id="count-val">5</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Theme</span></div>
      <select id="theme" class="dp-select"></select>
      <div class="dp-btn-row">
        <button id="reroll" class="dp-btn secondary">Reroll</button>
      </div>
      <div class="dp-note">Rerolls the jitter on every color but the key one.</div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Palette</span></div>
      <div class="dp-stats" id="readout"></div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
