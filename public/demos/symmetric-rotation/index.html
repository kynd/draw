<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Symmetric strokes — rotational</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Symmetry</span></div>
      <div class="dp-note">The drawn stroke rotated evenly around its starting point; the count (2-6) rolls per stroke.</div>
      <div class="dp-row">
        <span class="dp-label">Tool</span>
        <select id="tool-select" class="dp-select"><option value="cycle">Cycle per stroke</option></select>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Canvas</span></div>
      <div class="dp-btn-row">
        <button id="random-btn" class="dp-btn secondary">Randomize colors</button>
        <button id="clear-btn" class="dp-btn secondary">Clear</button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
