<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brush strokes — bristles, erosion and two pigments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}</script>
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap"><canvas id="canvas"></canvas></div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Brush</span></div>
      <div class="dp-row">
        <span class="dp-label">Bristles</span>
        <input id="bristles" class="dp-range" type="range" min="4" max="60" step="1" value="26" />
        <span class="dp-val" id="bristles-val">26</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Streak</span>
        <input id="streak" class="dp-range" type="range" min="0.5" max="14" step="0.5" value="5" />
        <span class="dp-val" id="streak-val">5.0</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Rough</span>
        <input id="rough" class="dp-range" type="range" min="0" max="1" step="0.02" value="0.35" />
        <span class="dp-val" id="rough-val">0.35</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Dry</span>
        <input id="dry" class="dp-range" type="range" min="0" max="0.8" step="0.02" value="0.30" />
        <span class="dp-val" id="dry-val">0.30</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Shape</span></div>
      <div class="dp-row">
        <span class="dp-label">Density</span>
        <input id="density" class="dp-range" type="range" min="10" max="320" step="5" value="60" />
        <span class="dp-val" id="density-val">60</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Width</span>
        <input id="width" class="dp-range" type="range" min="0.02" max="0.16" step="0.005" value="0.110" />
        <span class="dp-val" id="width-val">0.110</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Color</span></div>
      <div class="dp-note">Each stroke carries two pigments from the palette.</div>
      <div class="dp-btn-row">
        <button id="random-btn" class="dp-btn secondary">Randomize colors</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-section collapsed">
        <div class="dp-section-hd">
          <span class="dp-chevron"></span>
          <span class="dp-title">Geometry</span>
        </div>
        <div class="dp-section-body"><div id="readout"></div></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
