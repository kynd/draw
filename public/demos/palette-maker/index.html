<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palette maker — OKLCH palette generation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;700&family=Google+Sans+Code:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/demo-ui.css" />
  <style>
    /* Stage: one column per luminosity step, one row per hue. */
    .pm-stage { position: absolute; inset: 0; padding: 20px; }
    .pm-grid { display: grid; gap: 3px; width: 100%; height: 100%; }
    .pm-cell {
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: flex-end;
      padding: 4px 5px; gap: 1px;
      font-family: 'Google Sans Code', monospace; font-size: 0.52rem;
      line-height: 1.35;
      cursor: pointer; overflow: hidden;
      transition: outline-color 0.12s;
      outline: 2px solid transparent; outline-offset: -2px;
    }
    .pm-lch { font-size: 0.48rem; opacity: 0.72; white-space: nowrap; }
    .pm-cell:hover { outline-color: rgba(0,0,0,0.35); }
  </style>
</head>
<body>
  <div class="demo-layout">
    <div class="canvas-wrap">
      <div class="pm-stage"><div class="pm-grid" id="grid"></div></div>
      <div class="dp-toast" id="toast"></div>
    </div>

    <div class="dp-panel">
      <div class="dp-hd"><span class="dp-title">Hues</span></div>
      <canvas id="ring" class="dp-ring" width="220" height="220"></canvas>
      <div class="dp-note">Drag a handle to move that hue.</div>
      <div class="dp-row">
        <span class="dp-label">Count</span>
        <input id="nhues" class="dp-range" type="range" min="1" max="8" step="1" value="4" />
        <span class="dp-val" id="nhues-val">4</span>
      </div>
      <div class="dp-btn-row">
        <button id="even-btn" class="dp-btn secondary">Space evenly</button>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Lightness</span></div>
      <div class="dp-row">
        <span class="dp-label">Steps</span>
        <input id="nlum" class="dp-range" type="range" min="1" max="8" step="1" value="5" />
        <span class="dp-val" id="nlum-val">5</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Lightest</span>
        <input id="lum-high" class="dp-range" type="range" min="0.5" max="0.98" step="0.01" value="0.88" />
        <span class="dp-val" id="lum-high-val">0.88</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Darkest</span>
        <input id="lum-low" class="dp-range" type="range" min="0.05" max="0.5" step="0.01" value="0.28" />
        <span class="dp-val" id="lum-low-val">0.28</span>
      </div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Chroma</span></div>
      <div class="dp-row">
        <span class="dp-label">Most</span>
        <input id="vib-high" class="dp-range" type="range" min="0" max="1" step="0.01" value="0.95" />
        <span class="dp-val" id="vib-high-val">0.95</span>
      </div>
      <div class="dp-row">
        <span class="dp-label">Least</span>
        <input id="vib-low" class="dp-range" type="range" min="0" max="1" step="0.01" value="0.30" />
        <span class="dp-val" id="vib-low-val">0.30</span>
      </div>
      <div class="dp-note">Multipliers on the largest chroma sRGB can show at each lightness.</div>

      <hr class="dp-divider" />

      <div class="dp-hd"><span class="dp-title">Palette</span></div>
      <div class="dp-stats" id="readout"></div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
